[package]
name = "xm126"
version = "0.1.0"
edition = "2021"

[lib]
bench = false
test = false

[dependencies]
a121-rs = { path = "../../", features = ["distance", "nightly-logger"] }

panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

defmt = "1.0"
defmt-rtt = "1.0"

embassy-embedded-hal = { version = "0.5", features = ["defmt"] }
embassy-executor = { version = "0.9.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-nrf = { version = "0.7.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embassy-sync = { version = "0.7.2" }
embassy-time = { version = "0.5.0", features = [] }

embedded-alloc = "=0.6.0"
embedded-hal = "1.0"
embedded-hal-bus = "0.3.0"

libc = { version = "0.2", default-features = false }
heapless = { version = "0.9" }
static_cell = "2"
tinyrlibc = { version = "0.5.0", default-features = false, features = ["alloc", "snprintf"] }

# nrf-softdevice = { version = "0.1.0", default-features = false, features = ["nrf52840", "s140", "ble-peripheral", "ble-central", "ble-gatt-server", "critical-section-impl" ] }
# nrf-softdevice-s140 = { version = "0.1.2", default-features = false  }

[profile.dev]
lto = true
codegen-units = 1

[profile.release]
debug = 2
lto = true
codegen-units = 1
opt-level = "s"

[patch.crates-io]

