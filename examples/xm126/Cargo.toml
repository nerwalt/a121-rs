embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "476c43e2a5f3c2c6b962f1f5455a029fda2eccec" }
